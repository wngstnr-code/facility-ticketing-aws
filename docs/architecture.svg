<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <style>
      .t{font-size:22px;font-weight:700;fill:#111827}
      .s{font-size:16px;fill:#374151}
      .xs{font-size:14px;fill:#4b5563}
      .mono{font-family:'DejaVu Sans Mono',monospace;font-size:13.5px;fill:#1f2937}
      .lbl{font-size:15px;font-weight:600;fill:#1f2937}
      .num{font-size:16px;font-weight:700;fill:#fff}
      .sg{font-size:13.5px;font-weight:600;fill:#b91c1c}
    </style>
  </defs>
  <rect width="1800" height="1080" fill="#fff"/>
  <text x="40" y="50" font-size="30" font-weight="800" fill="#111827">Facility Ticketing — Arsitektur Track A (Cloud VM: EC2 + Amazon RDS for MySQL)</text>
  <text x="40" y="80" class="s">Wangsit Nursyahada · 545092 · Week 12 · Garis solid = dibangun di Week 12, garis putus-putus = rencana fase berikutnya</text>

  <rect x="40" y="200" width="230" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="58" y="234" class="t">Pelapor</text>
  <text x="58" y="258" class="s">Mahasiswa / dosen</text>
  <text x="58" y="282" class="xs">Browser · curl · Postman</text>
  <rect x="40" y="340" width="230" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="58" y="374" class="t">Teknisi / Admin</text>
  <text x="58" y="398" class="s">Laboran fasilitas</text>
  <text x="58" y="422" class="xs">Update status, hapus tiket</text>

  <rect x="40" y="490" width="230" height="200" rx="12" fill="#fff" stroke="#d1d5db"/>
  <text x="54" y="516" class="lbl">Alur request &amp; data</text>
  <text x="54" y="540" class="xs">1  HTTP :8080 ke IP publik EC2</text>
  <text x="54" y="562" class="xs">2  IGW → Public Subnet 1</text>
  <text x="54" y="584" class="xs">3  Flask/gunicorn proses CRUD</text>
  <text x="54" y="606" class="xs">4  PyMySQL → RDS :3306</text>
  <text x="54" y="628" class="xs">    (jaringan privat VPC)</text>
  <text x="54" y="650" class="xs">5  Hasil query → JSON/HTML</text>
  <text x="54" y="672" class="xs">    kembali ke client</text>

  <rect x="320" y="110" width="1440" height="680" rx="18" fill="#fffaf0" stroke="#d97706" stroke-width="2.5"/>
  <text x="345" y="145" font-size="21" font-weight="800" fill="#b45309">AWS Cloud · us-east-1 · akun AWS Academy Lab</text>

  <rect x="335" y="300" width="110" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="352" y="335" class="lbl">Internet</text>
  <text x="352" y="356" class="lbl">Gateway</text>

  <rect x="470" y="165" width="1270" height="605" rx="16" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="492" y="196" font-size="19" font-weight="800" fill="#6d28d9">VPC: LabVPC (vpc-0f089d8183c101541)</text>

  <rect x="495" y="215" width="560" height="430" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="244" class="lbl" fill="#15803d">Public Subnet 1 · route 0.0.0.0/0 → Internet Gateway</text>

  <rect x="520" y="262" width="510" height="250" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="540" y="296" class="t">Amazon EC2 — ticketing-app-server</text>
  <text x="540" y="320" class="xs">Dibuat via AWS Cloud9 · t3.small · Amazon Linux 2023 · IP publik</text>
  <rect x="540" y="334" width="470" height="160" rx="8" fill="#fff" stroke="#fdba74"/>
  <text x="556" y="358" class="lbl">systemd: facility-ticketing.service</text>
  <text x="556" y="380" class="xs">gunicorn (2 worker) :8080 → aplikasi Flask</text>
  <text x="556" y="404" class="mono">POST/GET  /api/tickets</text>
  <text x="556" y="424" class="mono">GET/PUT/DELETE /api/tickets/{id}</text>
  <text x="556" y="444" class="mono">GET /health   GET /  (halaman daftar)</text>
  <text x="556" y="470" class="xs">Kredensial DB: ~/.config/facility-ticketing/db.env</text>
  <text x="556" y="488" class="xs">(chmod 600, password acak, tidak di Git)</text>

  <rect x="520" y="528" width="510" height="100" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="538" y="554" class="sg">Security group EC2 (aws-cloud9-…, sg-07e42b96bb15eb7f2)</text>
  <text x="538" y="578" class="xs">Inbound TCP 8080 ← 157.85.213.25/32 (IP saya saja)</text>
  <text x="538" y="600" class="xs">Inbound TCP 22 ← IP layanan Cloud9 (dikelola Cloud9)</text>
  <text x="538" y="620" class="xs">Outbound: semua</text>

  <rect x="1105" y="215" width="610" height="430" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1125" y="244" class="lbl" fill="#1d4ed8">Private Subnet 1 &amp; 2 (DB subnet group, tanpa route ke IGW)</text>

  <rect x="1130" y="262" width="560" height="250" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1150" y="296" class="t">Amazon RDS for MySQL — ticketing-db</text>
  <text x="1150" y="320" class="xs">db.t3.micro · Single-AZ · 20 GB gp2 · enkripsi at-rest (KMS aws/rds)</text>
  <text x="1150" y="342" class="xs">Publicly accessible: No · backup otomatis 1 hari</text>
  <text x="1150" y="364" class="xs">Database: facility_tickets · user: ticketing_admin</text>
  <text x="1150" y="396" class="lbl">Entitas: tickets</text>
  <text x="1150" y="418" class="xs">id (PK), ticket_code (unik), title, description, location,</text>
  <text x="1150" y="438" class="xs">category, priority, status, reporter_name, assignee,</text>
  <text x="1150" y="458" class="xs">created_at, updated_at · index status</text>
  <text x="1150" y="490" class="xs">Endpoint privat: ticketing-db.….us-east-1.rds.amazonaws.com</text>

  <rect x="1130" y="528" width="560" height="100" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="1148" y="554" class="sg">Security group DB (ticketing-db-sg, sg-05aae6c30dd36e16f)</text>
  <text x="1148" y="578" class="xs">Inbound TCP 3306 ← HANYA dari security group EC2</text>
  <text x="1148" y="600" class="xs">(source = sg-07e42b96bb15eb7f2, bukan CIDR)</text>
  <text x="1148" y="620" class="xs">Tidak ada akses dari internet</text>

  <rect x="495" y="665" width="560" height="90" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="515" y="694" class="t">AWS IAM</text>
  <text x="515" y="718" class="xs">Cloud9 memakai kredensial sementara role lab (voclabs) untuk AWS CLI;</text>
  <text x="515" y="738" class="xs">tidak ada access key jangka panjang di instance maupun repositori.</text>

  <rect x="1105" y="665" width="610" height="90" rx="12" fill="#fff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1125" y="694" class="lbl">Rencana fase berikutnya</text>
  <text x="1125" y="716" class="xs">ALB + Auto Scaling Group (2 AZ) · RDS Multi-AZ · kredensial di</text>
  <text x="1125" y="736" class="xs">Secrets Manager · HTTPS (ACM) · CloudWatch alarm</text>

  <path d="M270,255 L333,330" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M270,395 L333,362" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <circle cx="300" cy="300" r="14" fill="#1f2937"/><text x="295" y="306" class="num">1</text>
  <path d="M447,345 L518,345" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <circle cx="482" cy="322" r="14" fill="#1f2937"/><text x="477" y="328" class="num">2</text>
  <circle cx="1000" cy="300" r="14" fill="#1f2937"/><text x="995" y="306" class="num">3</text>
  <path d="M1032,370 L1128,370" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="1040" y="360" class="xs">TCP 3306</text>
  <circle cx="1080" cy="395" r="14" fill="#1f2937"/><text x="1075" y="401" class="num">4</text>
  <path d="M1128,430 L1032,430" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <circle cx="1080" cy="455" r="14" fill="#1f2937"/><text x="1075" y="461" class="num">5</text>

  <rect x="40" y="815" width="1720" height="245" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="65" y="852" font-size="21" font-weight="800" fill="#374151">Alur deployment (dijalankan di terminal Cloud9 pada EC2 di atas)</text>
  <rect x="70" y="872" width="330" height="165" rx="12" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="90" y="904" class="t">GitHub</text>
  <text x="90" y="928" class="xs">wngstnr-code/facility-ticketing-aws</text>
  <text x="90" y="950" class="xs">app/, db/, scripts/, tests/, docs/</text>
  <text x="90" y="972" class="xs">README + commit bertahap</text>
  <text x="90" y="994" class="xs">Tanpa password / access key</text>
  <rect x="470" y="872" width="560" height="165" rx="12" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="490" y="904" class="t">Langkah</text>
  <text x="490" y="930" class="mono">1. git clone …/facility-ticketing-aws.git</text>
  <text x="490" y="952" class="mono">2. ./scripts/provision-rds.sh &lt;IP-saya&gt;/32</text>
  <text x="490" y="974" class="mono">3. ./scripts/setup-app.sh   (venv + systemd)</text>
  <text x="490" y="996" class="mono">4. ./scripts/seed.sh &amp;&amp; ./scripts/smoke-test.sh</text>
  <text x="490" y="1018" class="mono">5. ./scripts/cleanup.sh  → End Lab (hemat budget)</text>
  <rect x="1100" y="872" width="630" height="165" rx="12" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="1120" y="904" class="t">Yang dibuat provision-rds.sh (AWS CLI)</text>
  <text x="1120" y="930" class="xs">• Rule SG EC2: 8080 dari IP saya</text>
  <text x="1120" y="952" class="xs">• SG ticketing-db-sg: 3306 hanya dari SG EC2</text>
  <text x="1120" y="974" class="xs">• RDS MySQL privat di DB subnet group LabVPC (password acak 24 karakter)</text>
  <text x="1120" y="996" class="xs">• Menunggu status available, lalu tulis db.env (chmod 600)</text>
  <text x="1120" y="1018" class="xs">Skrip idempoten: aman dijalankan ulang</text>
  <path d="M402,955 L468,955" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M1032,955 L1098,955" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M1400,870 L1400,792" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
  <text x="1412" y="836" class="xs">provisioning</text>
</svg>
